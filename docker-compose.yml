services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: 1234567 # Contraseña del usuario root
      MYSQL_DATABASE: caprino    # Base de datos por defecto
      MYSQL_USER: caprino        # Usuario regular
      MYSQL_PASSWORD: 123456   # Contraseña del usuario regular
    volumes:
      - /Users/jorgechirivi/Documents/Docker/AlmacenesCaprinoPhp8/Datos_Mysql/:/var/lib/mysql
      - /Users/jorgechirivi/Documents/Docker/AlmacenesCaprinoPhp8/ConfiguracionDocker/mysql_config/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - red_caprino
    ports:
      - "3306:3306"
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    networks:
      - red_caprino
    ports:
      - "8080:80"            
  
  php:
    build:
      context: ./ConfiguracionDocker/php
    volumes:
      - /Users/jorgechirivi/Documents/Docker/AlmacenesCaprinoPhp8:/var/www/html # Volumen para tu código PHP
      - /Users/jorgechirivi/Documents/Docker/AlmacenesCaprinoPhp8/ConfiguracionDocker/php/php.ini:/usr/local/etc/php/php.ini # Montar el php.ini
    networks:
      - red_caprino
  nginx:
    image: nginx:latest
    volumes:
      - ./ConfiguracionDocker/nginx/default.conf:/etc/nginx/conf.d/default.conf  # Archivo de configuración de Nginx
      - ./:/var/www/html # Volumen para tu código PHP
    networks:
      - red_caprino
    ports:
      - "80:80"        
    depends_on:
      - php  

networks:
  red_caprino:
    driver: bridge
volumes:
  mysql_data:
    driver: local    