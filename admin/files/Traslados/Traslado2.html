<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<style>
		@page {
			size: 76mm 180mm;
			margin: 0;
		}

		body {
			font-family: Arial, sans-serif;
			font-size: 8pt;
			margin: 0;
			padding: 4mm;
			width: 72mm;
			box-sizing: border-box;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 4px;
		}

		.texto {
			font-size: 7pt;
			line-height: 1.15;
		}

		.center {
			text-align: center;
		}

		.right {
			text-align: right;
		}

		.bold {
			font-weight: bold;
		}

		.border-top {
			border-top: 1px dotted #000;
			margin-top: 5px;
			padding-top: 5px;
		}

		.item-table th,
		.item-table td {
			font-size: 6.5pt;
			padding: 2px 0;
			vertical-align: top;
		}

		.item-table th {
			text-align: left;
			border-bottom: 1px solid #000;
		}

		.item-table .talla,
		.item-table .cantidad,
		.item-table .tarjeta {
			text-align: center;
		}
	</style>
</head>
<body>
	<div class="center bold texto">
		TRASLADO No. 2	</div>

	<div class="texto border-top">
		<strong>Almacen Destino:</strong> Calle 60<br>
		<strong>Almacen Origen:</strong> Junin<br>
		<strong>Fecha Traslado:</strong> 2026-04-15 17:54:43<br>
		<strong>Realizado por:</strong> Junin <br>
		<strong>Estado:</strong> 	</div>

			<div class="texto border-top">
			<strong>Observaciones:</strong><br>
			test		</div>
	
	<table class="item-table border-top">
		<tr>
			<th>Referencia</th>
			<th class="talla">Talla</th>
			<th class="cantidad">Cant</th>
			<th class="tarjeta">Tarjeta</th>
		</tr>
					<tr>
				<td>MDTP****</td>
				<td class="talla">36</td>
				<td class="cantidad">1</td>
				<td class="tarjeta"></td>
			</tr>
				<tr class="bold">
			<td colspan="2">TOTAL</td>
			<td class="cantidad">1</td>
			<td></td>
		</tr>
	</table>
</body>
</html>
